
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Little Universe ✨</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    font-family: 'Segoe UI', sans-serif;
    color: white;
    background: linear-gradient(135deg, #141e30, #243b55);
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    transition: background 0.6s;
}

.stars {
    position: fixed;
    inset: 0;
    pointer-events: none;
}

.star {
    position: absolute;
    color: white;
    animation: twinkle 2s infinite alternate;
}

@keyframes twinkle {
    from { opacity: 0.2; transform: scale(0.7); }
    to { opacity: 1; transform: scale(1.3); }
}

.container {
    width: 90%;
    max-width: 430px;
    padding: 35px 25px;
    text-align: center;
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 25px;
    background: rgba(255,255,255,0.09);
    backdrop-filter: blur(15px);
    box-shadow: 0 10px 40px rgba(0,0,0,0.25);
    z-index: 1;
    animation: appear 1s ease;
}

@keyframes appear {
    from { opacity: 0; transform: translateY(30px); }
    to { opacity: 1; transform: translateY(0); }
}

.emoji {
    font-size: 55px;
    margin-bottom: 15px;
}

h1 {
    font-size: 29px;
    margin-bottom: 10px;
}

.subtitle {
    color: #d5d9e8;
    font-size: 14px;
    margin-bottom: 25px;
}

.clock {
    font-size: 38px;
    font-weight: bold;
    letter-spacing: 3px;
    margin: 15px 0;
}

.date {
    color: #c5d0e0;
    margin-bottom: 25px;
}

.message {
    line-height: 1.7;
    font-size: 15px;
    min-height: 75px;
}

button {
    border: none;
    padding: 12px 22px;
    margin: 8px 4px;
    border-radius: 30px;
    cursor: pointer;
    font-size: 14px;
    font-weight: bold;
    color: #26334c;
    background: #ffffff;
    transition: 0.3s;
}

button:hover {
    transform: translateY(-4px);
    box-shadow: 0 5px 20px #ffffff55;
}

.footer {
    margin-top: 25px;
    font-size: 12px;
    color: #c5d0e0;
}
</style>
</head>

<body>

<div class="stars" id="stars"></div>

<div class="container">
    <div class="emoji">🌌</div>

    <h1>My Little Universe</h1>
    <p class="subtitle">Welcome to my little world ✨</p>

    <div class="clock" id="clock">00:00:00</div>
    <div class="date" id="date"></div>

    <p class="message" id="message">
        Mỗi ngày đều là một cơ hội mới.
        Hãy tận hưởng những điều nhỏ bé nhé! 🌷
    </p>

    <br>

    <button onclick="changeMessage()">
        Một lời nhắn 💌
    </button>

    <button onclick="changeTheme()">
        Đổi vũ trụ 🎨
    </button>

    <div class="footer">
        Made with ✨ and a little imagination
    </div>
</div>

<script>
function updateClock() {
    const now = new Date();

    document.getElementById("clock").textContent =
        now.toLocaleTimeString("vi-VN");

    document.getElementById("date").textContent =
        now.toLocaleDateString("vi-VN", {
            weekday: "long",
            day: "numeric",
            month: "long",
            year: "numeric"
        });
}

setInterval(updateClock, 1000);
updateClock();

const messages = [
    "Đừng quên rằng những nỗ lực nhỏ hôm nay sẽ tạo nên điều lớn lao ngày mai. 🌱",
    "Không cần phải hoàn hảo, chỉ cần tốt hơn chính mình ngày hôm qua. 💙",
    "Thế giới rộng lớn, hãy cứ tò mò và khám phá nhé! 🌎",
    "Một ngày bình thường cũng có thể chứa đựng những điều tuyệt vời. 🌷",
    "Believe in yourself. You are capable of amazing things! ⭐"
];

function changeMessage() {
    const random = Math.floor(Math.random() * messages.length);
    document.getElementById("message").textContent =
        messages[random];
}

const themes = [
    "linear-gradient(135deg, #141e30, #243b55)",
    "linear-gradient(135deg, #42275a, #734b6d)",
    "linear-gradient(135deg, #134e5e, #71b280)",
    "linear-gradient(135deg, #ee9ca7, #ffdde1)",
    "linear-gradient(135deg, #232526, #414345)"
];

let themeIndex = 0;

function changeTheme() {
    themeIndex = (themeIndex + 1) % themes.length;
    document.body.style.background = themes[themeIndex];
}

// Tạo các ngôi sao
const starContainer = document.getElementById("stars");

for (let i = 0; i < 60; i++) {
    const star = document.createElement("div");
    star.className = "star";
    star.textContent = "✦";
    star.style.left = Math.random() * 100 + "%";
    star.style.top = Math.random() * 100 + "%";
    star.style.fontSize = (Math.random() * 12 + 5) + "px";
    star.style.animationDelay = Math.random() * 3 + "s";
    starContainer.appendChild(star);
}
</script>

</body>
  </html>
